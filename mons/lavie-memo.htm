<div>라비엔테의 육질 변화</div>
<p>
퀘스트 중은, 공격한 속성이 어느 일정치에 도달하면, 그 속성만 내성 후의 육질로 변한다<br>
분노 상태의 경우는 참타탄의 육질이 변화. 속성값은 상기에 준한다.<br>
<br>
독화<br>
랜드 전체에서 축적치는 계산되며, 축적 후에 독탄 지원이 이루어짐으로써 발동. 합계 20000 대미지를 준다<br>
<br>
부위파괴<br>
출격마다파괴가 가능하다.머리,몸통,꼬리<br>
<br>
특수부위파괴<br>
랜드 전체에서 대미지의 축적치는 계산되며, 축적 후에 부위파괴 지원으로 파괴된다.<br>
1회의 대토벌에서, 1부위 1회밖에 파괴할 수 없고, 공헌포인트만으로 파괴보수는 없다.<br>
</p>
