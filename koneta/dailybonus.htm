<h4>매일 특전</h4>
<p>
종합 상점의 「매일 특전」에서 1일 1회(12:00 갱신) 아래의 특전을 얻을 수 있습니다.<br>
PC방 포인트의 상한은 60,000P. 그 외에는 받을 때마다 덮어쓰여집니다.</p>
<table border=1 cellspacing=0 cellpadding=2>

<tr><td>엑스트라 코스：+1포인트</td></tr>

<tr><td>기운의 원천권</td><td>5회</td></tr>
