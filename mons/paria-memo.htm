<body>
<div>파리아푸리아의 구토</div>
<p>
타액에 젖은 고기를 5~7개 먹이면 배가 불러 비틀비틀 걷기 시작한다.<br>
이 상태 시에 공격을 가해, 휘청거리게 함으로써, 구토시킬 수 있다.<br>
<br>
흰색→생고기<br>
보라색→독생고기<br>
황색→마비생고기<br>
수색→수면생고기<br>
<br>
※타액의 색과 다른 고기를 먹여도 배가 부풀지만, 구토 횟수가 감소한다<br>
<br>
드롭 아이템은 백×2→초록×2→보라×2→파랑 순서로 토하며, MAX로 9회<br>
·배가 가득 찰 때까지 타액의 색과 전체 같은 색의 고기를 계속 먹이면, 첫 번째 구토부터 보라색이 나온다<br>
</p>
