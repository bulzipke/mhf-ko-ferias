name: 번역·표기 오류
description: 오역, 어색한 문장, 게임과 다른 표기, 남아 있는 일본어를 알려 주세요.
title: "[번역] "
labels: ["번역"]
body:
  - type: input
    id: url
    attributes:
      label: 페이지 주소
      description: 문제가 있는 페이지의 주소를 붙여 주세요.
      placeholder: https://ferias.bulzipke.com/skill/skillsimu.htm
    validations:
      required: true
  - type: input
    id: current
    attributes:
      label: 지금 표기
      placeholder: 예) 비전 이중 장비
    validations:
      required: true
  - type: input
    id: suggestion
    attributes:
      label: 고쳐야 할 표기
      placeholder: 예) 비전이중장비
  - type: textarea
    id: reason
    attributes:
      label: 근거
      description: 게임 안 표기, 일본어 원문, 다른 페이지 표기 등 근거가 있으면 적어 주세요. mhf-ko-localization 의 번역중/*.csv 에서 일본어 원문으로 검색하면 게임 표기를 확인할 수 있습니다.
  - type: textarea
    id: screenshot
    attributes:
      label: 스크린샷
      description: 이미지를 끌어다 놓으면 첨부됩니다.
