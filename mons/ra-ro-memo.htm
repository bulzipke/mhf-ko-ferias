<div>ＵＮＫＮＯＷＮ의 육질 이행·상태이상 내성</div>
<p>
특정 체력 이하가 되면, 포효 모션이 발동하며, 육질이 다음 단계로 이행한다.<br>
그때, 체력은 규정 체력으로 강제 리셋된다.<br>
또한 상태이상 내성도 1단계 상승한다.<br>
육질 5 이후는 상태이상이 무효<br>
</p>
